<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Computador 8-bit no Digital</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: janela de aplicativo de simulação — barra de ferramentas no topo, prancheta do circuito ocupando o resto */
:root {
  --chrome: #eceef1;
  --chrome-2: #dfe3e8;
  --ink: #1d2128;
  --muted: #5d6573;
  --line: #c3c9d2;
  --accent: #0b6bcb;
  --canvas: #ffffff;
  --ok: #2f9e44;
  --err: #d6336c;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --chrome: #23272e; --chrome-2: #2d323a; --ink: #e7eaee; --muted: #a0a8b4; --line: #3c434d; --accent: #5aa6f0; color-scheme: dark; }
}
:root[data-theme="dark"] { --chrome: #23272e; --chrome-2: #2d323a; --ink: #e7eaee; --muted: #a0a8b4; --line: #3c434d; --accent: #5aa6f0; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--chrome); color: var(--ink); font: 14px/1.4 var(--font-ui); display: flex; flex-direction: column; }
.bar {
  display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center;
  padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--chrome);
}
.bar h1 { font-size: 15px; margin: 0 6px 0 0; font-weight: 650; white-space: nowrap; }
.group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.sep { width: 1px; align-self: stretch; background: var(--line); }
button, select, input { font: 500 13px var(--font-ui); color: var(--ink); background: var(--chrome-2); border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; padding-block: 6px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); font-size: 13px; }
.crumbs button { background: none; border: 0; padding: 2px 6px; color: var(--accent); }
.crumbs button[aria-current] { color: var(--ink); font-weight: 650; cursor: default; }
.crumbs span { color: var(--muted); }
.crumbs .hint { margin-left: auto; color: var(--muted); }
.stage { position: relative; flex: 1; min-height: 0; background: var(--canvas); }
svg#board { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; background: #fff; font-family: Arial, Helvetica, sans-serif; }
svg#board .el.sub { cursor: zoom-in; }
svg#board .el.sub:hover polygon:first-of-type { fill: rgba(150, 200, 255, .55); }
svg#board .el.io { cursor: pointer; }
.status { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: max(10px, env(safe-area-inset-bottom, 0px)); background: rgba(255,255,255,.92); color: #1d2128; border: 1px solid #c3c9d2; border-radius: 5px; padding: 4px 8px; font: 12px var(--font-mono); pointer-events: none; }
.status.err { color: #c92a2a; border-color: #c92a2a; }
.pop { position: absolute; z-index: 5; background: var(--chrome); border: 1px solid var(--line); border-radius: 6px; padding: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.18); display: flex; flex-direction: column; gap: 8px; max-width: calc(100% - 20px); }
.pop h2 { font-size: 13px; margin: 0; }
.pop .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pop input[type=number] { width: 90px; }
.ramgrid { display: grid; grid-template-columns: auto repeat(16, minmax(0, 1fr)); gap: 2px; font: 11px var(--font-mono); max-height: 50vh; overflow: auto; }
.ramgrid input { width: 30px; padding: 2px; font: 11px var(--font-mono); text-align: center; border-radius: 3px; }
.ramgrid .ah { color: var(--muted); padding-right: 4px; align-self: center; }
.ramgrid input.cur { border-color: var(--err); }
@media (max-width: 640px) { .sep, .crumbs .hint, .bar h1 { display: none; } }
</style>
</head>
<body>
<div class="bar">
  <h1>Computador 8-bit</h1>
  <div class="group">
    <label for="file">Circuito</label>
    <select id="file"></select>
  </div>
  <span class="sep"></span>
  <div class="group" role="group" aria-label="Clock">
    <button id="run" class="on" title="Liga/desliga o clock automático">❚❚ Pausar</button>
    <button id="tick" title="Inverte o clock uma vez (meio ciclo)">Pulso de clock</button>
    <label for="speed">Freq. <input type="range" id="speed" min="1" max="40" value="4"> <span id="speedLbl">4 Hz</span></label>
  </div>
  <span class="sep"></span>
  <div class="group">
    <button id="reset" title="Reinicia a simulação">Reiniciar</button>
    <button id="fit" title="Enquadrar o circuito">Enquadrar</button>
    <button id="zin" aria-label="Aproximar">+</button>
    <button id="zout" aria-label="Afastar">−</button>
  </div>
</div>
<nav class="crumbs" id="crumbs" aria-label="Hierarquia"></nav>
<div class="stage" id="stage">
  <svg id="board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Circuito"></svg>
  <div class="status" id="status"></div>
  <div class="pop" id="pop" hidden></div>
</div>

<script src="web/circuits.js"></script>
<script src="web/digital.js"></script>
<script>
(() => {
  const D = window.DigitalWeb;
  D.loadLibrary(window.DIG_FILES);
  const $ = id => document.getElementById(id);
  const MAIN = ["CounterProgram.dig", "COMPUTADORWITHOUTSTEPPER.dig"];
  const fileSel = $("file");
  const all = Object.keys(window.DIG_FILES).sort((a, b) => a.localeCompare(b));
  fileSel.innerHTML = `<optgroup label="Computador">${MAIN.map(f => `<option value="${f}">${f.replace(".dig", "")}</option>`).join("")}</optgroup>` +
    `<optgroup label="Componentes">${all.filter(f => !MAIN.includes(f)).map(f => `<option value="${f}">${f.replace(".dig", "")}</option>`).join("")}</optgroup>`;

  let sim, view, stack = [], timer = null, hz = 4, running = true, missing = [];

  function load(file) {
    closePop();
    sim = new D.Sim(file);
    missing = [...new Set(D.missingIn(file))];
    stack = [sim.top];
    if (!view) view = new D.View($("board"), sim, onElement); else view.sim = sim;
    view.show(sim.top);
    crumbs();
    status();
  }
  function enter(inst) { stack.push(inst); view.show(inst); crumbs(); closePop(); }
  function crumbs() {
    const c = $("crumbs");
    c.innerHTML = stack.map((inst, i) => {
      const name = i === 0 ? inst.file.replace(".dig", "") : inst.label;
      const cur = i === stack.length - 1 ? ' aria-current="page"' : "";
      return (i ? "<span>›</span>" : "") + `<button data-i="${i}"${cur}>${name}</button>`;
    }).join("") + `<span class="hint">Clique num bloco para abrir o circuito interno. Arraste para mover, role para zoom.</span>`;
  }
  $("crumbs").addEventListener("click", e => {
    const b = e.target.closest("button[data-i]"); if (!b) return;
    const i = +b.dataset.i; if (i === stack.length - 1) return;
    stack = stack.slice(0, i + 1); view.show(stack[i]); crumbs(); closePop();
  });

  function compAt(inst, idx) { return sim.comps.find(c => c.inst === inst && c.idx === idx); }
  function onElement(ev) {
    const { inst, idx, el } = ev;
    if (inst.children[idx]) { enter(inst.children[idx]); return; }
    const comp = compAt(inst, idx);
    if (!comp) return;
    if (el.name === "Clock") { comp.value ^= 1; sim.poke(comp); refresh(); return; }
    if (el.name === "In") {
      const bits = el.attrs.Bits || 1;
      if (bits === 1) { comp.value ^= 1; sim.poke(comp); refresh(); }
      else openInPop(comp, bits, ev);
      return;
    }
    if (el.name === "RAMDualPort") openRam(comp, ev);
  }

  // --- popovers
  const pop = $("pop");
  function place(ev) {
    const r = $("stage").getBoundingClientRect();
    pop.hidden = false;
    const w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = Math.max(10, Math.min(ev.clientX - r.left, r.width - w - 10)) + "px";
    pop.style.top = Math.max(10, Math.min(ev.clientY - r.top + 10, r.height - h - 10)) + "px";
  }
  function closePop() { pop.hidden = true; pop.innerHTML = ""; }
  function openInPop(comp, bits, ev) {
    pop.innerHTML = `<h2>Entrada de ${bits} bits</h2>
      <div class="row"><input type="number" id="inVal" min="0" max="${2 ** bits - 1}" value="${comp.value}">
      <button id="inSet">Aplicar</button><button id="inClose">Fechar</button></div>`;
    place(ev);
    const apply = () => { comp.value = Math.max(0, Math.min(2 ** bits - 1, parseInt($("inVal").value, 10) || 0)); sim.poke(comp); refresh(); };
    $("inSet").onclick = apply;
    $("inVal").onkeydown = e => { if (e.key === "Enter") apply(); if (e.key === "Escape") closePop(); };
    $("inClose").onclick = closePop;
    $("inVal").focus(); $("inVal").select();
  }
  let ramComp = null;
  function openRam(comp, ev) {
    ramComp = comp;
    let h = `<h2>RAM (valores em hexadecimal)</h2><div class="ramgrid"><span></span>`;
    for (let c = 0; c < 16; c++) h += `<span class="ah" style="text-align:center">${c.toString(16).toUpperCase()}</span>`;
    for (let r = 0; r < comp.mem.length / 16; r++) {
      h += `<span class="ah">${(r * 16).toString(16).toUpperCase().padStart(2, "0")}</span>`;
      for (let c = 0; c < 16; c++) { const a = r * 16 + c; h += `<input data-a="${a}" aria-label="Endereço ${a}" value="${comp.mem[a].toString(16).toUpperCase().padStart(2, "0")}">`; }
    }
    h += `</div><div class="row"><button id="ramClose">Fechar</button><span style="color:var(--muted);font-size:12px">Edite uma célula e tecle Enter.</span></div>`;
    pop.innerHTML = h; place(ev);
    pop.querySelector(".ramgrid").addEventListener("change", e => {
      const a = +e.target.dataset.a; const v = parseInt(e.target.value, 16);
      if (!isNaN(v)) { comp.mem[a] = v & 0xff; sim.queue.add(comp); sim.settle(); refresh(); }
    });
    $("ramClose").onclick = closePop;
  }
  function refreshRam() {
    if (pop.hidden || !ramComp || !pop.querySelector(".ramgrid")) return;
    pop.querySelectorAll(".ramgrid input").forEach(inp => {
      if (document.activeElement === inp) return;
      const a = +inp.dataset.a, t = ramComp.mem[a].toString(16).toUpperCase().padStart(2, "0");
      if (inp.value !== t) inp.value = t;
      inp.classList.toggle("cur", a === ramComp.addr());
    });
  }

  // --- clock
  function status() {
    const s = $("status");
    if (sim.oscillating) { s.textContent = "Oscilação detectada: o circuito não estabilizou."; s.classList.add("err"); return; }
    s.classList.remove("err");
    if (missing.length) { s.textContent = `Arquivo ausente no repositório: ${missing.join(", ")}`; s.classList.add("err"); return; }
    const clk = sim.clocks[0];
    s.textContent = sim.clocks.length ? `clock ${clk.value ? "1" : "0"} · ${running ? hz + " Hz" : "pausado"}` : "sem clock neste circuito";
  }
  function refresh() { view.update(); refreshRam(); status(); }
  function setRun(on) {
    running = on; clearInterval(timer);
    $("run").classList.toggle("on", on);
    $("run").textContent = on ? "❚❚ Pausar" : "▶ Rodar";
    if (on) timer = setInterval(() => { sim.clockTick(); refresh(); }, 500 / hz);
    status();
  }
  $("run").onclick = () => setRun(!running);
  $("tick").onclick = () => { setRun(false); sim.clockTick(); refresh(); };
  $("speed").oninput = e => { hz = +e.target.value; $("speedLbl").textContent = hz + " Hz"; if (running) setRun(true); };
  $("reset").onclick = () => { const f = stack[0].file; load(f); };
  $("fit").onclick = () => view.fit();
  $("zin").onclick = () => { const r = $("board").getBoundingClientRect(); view.zoom(0.8, r.left + r.width / 2, r.top + r.height / 2); };
  $("zout").onclick = () => { const r = $("board").getBoundingClientRect(); view.zoom(1.25, r.left + r.width / 2, r.top + r.height / 2); };
  fileSel.onchange = () => { load(fileSel.value); try { history.replaceState(null, "", "#" + encodeURIComponent(fileSel.value.replace(".dig", ""))); } catch (e) {} };
  window.addEventListener("hashchange", () => { const f = fromHash(); if (f) { fileSel.value = f; load(f); } });
  window.addEventListener("resize", () => view && view.fit());
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });

  function fromHash() { const h = decodeURIComponent(location.hash.slice(1)); return h && window.DIG_FILES[h + ".dig"] ? h + ".dig" : null; }
  const start = fromHash() || "CounterProgram.dig";
  fileSel.value = start;
  load(start);
  setRun(true);
  window.__app = { get sim() { return sim; }, get view() { return view; }, enter, stack: () => stack };
})();
</script>
</body>
</html>
